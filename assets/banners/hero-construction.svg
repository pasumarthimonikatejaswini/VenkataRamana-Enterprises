<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1C1A" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0A0A09" />
    </linearGradient>
    <linearGradient id="beamGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C778" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#917234" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="crimsonAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8102E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C8102E" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#skyGrad)" />
  <rect width="1200" height="600" fill="url(#grid)" />

  <!-- Diagonal Construction Perspective Beams -->
  <polygon points="0,600 350,200 480,200 130,600" fill="url(#beamGold)" />
  <polygon points="1200,600 850,150 720,150 1070,600" fill="url(#beamGold)" />
  
  <!-- Architectural Silhouette Truss Structures -->
  <g stroke="#C5A059" stroke-width="1.2" opacity="0.18">
    <line x1="100" y1="600" x2="350" y2="250" />
    <line x1="200" y1="600" x2="450" y2="250" />
    <line x1="150" y1="425" x2="350" y2="250" />
    <line x1="250" y1="425" x2="450" y2="250" />
    <line x1="350" y1="250" x2="450" y2="250" />

    <line x1="1100" y1="600" x2="850" y2="200" />
    <line x1="1000" y1="600" x2="750" y2="200" />
    <line x1="1050" y1="400" x2="850" y2="200" />
    <line x1="950" y1="400" x2="750" y2="200" />
    <line x1="850" y1="200" x2="750" y2="200" />
  </g>

  <!-- Crane Silhouettes in Background -->
  <g stroke="#C8102E" stroke-width="1.8" opacity="0.22">
    <!-- Crane 1 -->
    <line x1="300" y1="500" x2="300" y2="120" stroke-width="2.5" />
    <line x1="200" y1="130" x2="480" y2="130" stroke-width="2" />
    <line x1="300" y1="120" x2="300" y2="90" />
    <line x1="300" y1="90" x2="450" y2="130" />
    <line x1="300" y1="90" x2="220" y2="130" />
    <!-- Rigging wire -->
    <line x1="420" y1="130" x2="420" y2="210" stroke-dasharray="3,3" />

    <!-- Crane 2 (Distant) -->
    <line x1="900" y1="500" x2="900" y2="160" stroke-width="2" opacity="0.15" />
    <line x1="800" y1="170" x2="1050" y2="170" stroke-width="1.5" opacity="0.15" />
  </g>

  <!-- Monolithic Foundation Floor -->
  <polygon points="0,520 1200,480 1200,600 0,600" fill="#0D0D0C" opacity="0.8" />
  <line x1="0" y1="520" x2="1200" y2="480" stroke="#C5A059" stroke-width="2" opacity="0.4" />
</svg>
