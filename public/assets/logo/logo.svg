<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#9E0B22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C275" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#917234" />
    </linearGradient>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2B29" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
  </defs>

  <!-- Geometric Emblem / Icon -->
  <g transform="translate(15, 10)">
    <!-- Hexagonal / Shield Foundation -->
    <polygon points="50,2 96,28 96,72 50,98 4,72 4,28" fill="url(#charcoalGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Stylized Construction Beams (I-Beam & Foundation block) -->
    <path d="M 28 30 L 72 30 L 72 36 L 54 36 L 54 64 L 72 64 L 72 70 L 28 70 L 28 64 L 46 64 L 46 36 L 28 36 Z" fill="url(#goldGrad)" />
    <!-- Architectural Diagonal Accent -->
    <polygon points="26,72 50,24 53,24 29,72" fill="url(#ironGrad)" opacity="0.95" />
    <polygon points="47,72 71,24 74,24 50,72" fill="url(#ironGrad)" opacity="0.95" />
    <!-- Base Foundation Line -->
    <rect x="22" y="76" width="56" height="4" rx="2" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <!-- Business Name -->
  <text x="135" y="48" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="800" fill="#141414" letter-spacing="1.5">
    VENKATARAMANA
  </text>
  <text x="430" y="48" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#C8102E" letter-spacing="1.5">
    ENTERPRISES
  </text>

  <!-- Decorative Divider Rule -->
  <line x1="135" y1="62" x2="615" y2="62" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- Tagline & Established Badge -->
  <text x="136" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#524E4A" letter-spacing="2.8">
    ONE STOP SOLUTION FOR BUILDING SOLUTION
  </text>
  
  <rect x="136" y="88" width="85" height="18" rx="3" fill="#141414" />
  <text x="142" y="101" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#F7F1E3" letter-spacing="1">
    ESTD. 2016
  </text>

  <rect x="228" y="88" width="135" height="18" rx="3" fill="#FAF6F0" stroke="#E6DFD5" stroke-width="1" />
  <text x="235" y="101" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#C8102E" letter-spacing="1">
    IRON &amp; CEMENTS STORE
  </text>
</svg>
