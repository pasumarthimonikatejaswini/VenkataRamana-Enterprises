<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <linearGradient id="ironGradSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E" />
      <stop offset="100%" stop-color="#9E0B22" />
    </linearGradient>
    <linearGradient id="goldGradSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F1E3" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#917234" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#242220" />
      <stop offset="100%" stop-color="#0E0D0C" />
    </radialGradient>
  </defs>

  <!-- Background with gold border -->
  <rect x="4" y="4" width="184" height="184" rx="36" fill="url(#bgGrad)" stroke="url(#goldGradSquare)" stroke-width="4" />

  <!-- Shield Shape -->
  <polygon points="96,24 154,58 154,124 96,160 38,124 38,58" fill="#141414" stroke="url(#goldGradSquare)" stroke-width="3" />

  <!-- I-Beam Construction Monolith -->
  <path d="M 64 64 L 128 64 L 128 72 L 102 72 L 102 112 L 128 112 L 128 120 L 64 120 L 64 112 L 90 112 L 90 72 L 64 72 Z" fill="url(#goldGradSquare)" />
  
  <!-- Steel Reinforcement Truss Line (Crimson) -->
  <polygon points="62,122 96,56 100,56 66,122" fill="url(#ironGradSquare)" />
  <polygon points="92,122 126,56 130,56 96,122" fill="url(#ironGradSquare)" />

  <!-- Bottom Monogram "VE" -->
  <text x="96" y="148" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="900" fill="#F7F1E3" text-anchor="middle" letter-spacing="2">
    VE 2016
  </text>
</svg>
